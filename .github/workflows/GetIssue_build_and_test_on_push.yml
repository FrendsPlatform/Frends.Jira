name: GetIssue build test

on:
  push:
    branches-ignore: 
      - main
    paths:
      - 'Frends.Jira.GetIssue/**'
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/linux_build_test.yml@main
    with:
      workdir: Frends.Jira.GetIssue
      env_var_name_1: TestJiraCloudUrl
      env_var_name_2: TestJiraCloudEmail
      env_var_name_3: TestJiraCloudToken
      env_var_name_4: TestJiraCloudProject
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      test_feed_api_key: ${{ secrets.TASKS_TEST_FEED_API_KEY }}
      env_var_value_1: ${{ secrets.TESTJIRACLOUDURL }}
      env_var_value_2: ${{ secrets.TESTJIRACLOUDEMAIL }}
      env_var_value_3: ${{ secrets.TESTJIRACLOUDTOKEN }}
      env_var_value_4: ${{ secrets.TESTJIRACLOUDPROJECT }}
